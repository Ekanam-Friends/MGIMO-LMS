[project]
name = "mgimo-lms"
version = "0.1.0"
description = "Прототип личного кабинета студента МГИМО (концепт для конкурса MGIMO×AI Challenge)"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "reportlab>=4.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "aiogram>=3.15",
    "aiohttp-socks>=0.9",
    "icalendar>=6.0",
    "snowballstemmer>=2.2,<4",
    "redis>=5,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "aiosqlite>=0.20", "fakeredis>=2.26"]
rag = ["pymupdf>=1.24,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
