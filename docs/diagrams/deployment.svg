<path d="M360 905 H400 V875 H430" fill="none" stroke="#7c96b4" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" marker-start="url(#arrow)" />
<path d="M830 965 H790 V850 H710" fill="none" stroke="#7c96b4" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" marker-start="url(#arrow)" />
<path d="M220 955 V1035 H1150 V860 H980 V845" fill="none" stroke="#7c96b4" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"  stroke-dasharray="7 6"/>
<rect x="559" y="1016" width="182" height="27" rx="6" fill="#fff" stroke="#fff" stroke-width="1.5" />
<text x="650" y="1035" text-anchor="middle" font-size="16" fill="#536780">бот → proxy Ikanam</text>
<text x="50" y="1110" font-size="18" fill="#536780" font-weight="400">База не публикуется в интернет. Серверные секреты и override остаются вне репозитория.</text>
<text x="50" y="1137" font-size="16" fill="#536780" font-weight="400">Пунктир — выход бота к Telegram через proxy Ikanam; чужая база не используется.</text>
</g></svg>
