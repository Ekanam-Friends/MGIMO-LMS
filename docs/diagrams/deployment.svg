<text x="422" y="472" font-size="23" fill="#122844" font-weight="650">Общий Caddy</text>
<text x="422" y="501" font-size="18" fill="#536780" font-weight="400">ikanam-caddy-1 · HTTPS / 443</text>
</g>
<rect x="50" y="630" width="710" height="370" rx="22" fill="#f2f6fc" stroke="#d8e3f0" stroke-width="1.5" />
<text x="75" y="666" font-size="16" fill="#2463ad" font-weight="700">MGIMO-LMS / СВОЯ DOCKER-СЕТЬ И БАЗА</text>
