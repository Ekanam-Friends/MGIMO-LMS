<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1150" viewBox="0 0 1200 1150" role="img" aria-labelledby="title desc">
<title id="title">Один VPS. Изолированные приложения.</title><desc id="desc">Интернет приходит на общий Caddy, который направляет запросы в MGIMO-LMS через сеть edge или в Ikanam через его сеть. Web и bot MGIMO-LMS работают с собственной PostgreSQL. Бот использует proxy Ikanam для Telegram, не его базу. Для команды база доступна через SSH-туннель к loopback-порту 5433.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c96b4"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif"><rect width="1200" height="1150" rx="24" fill="#fff"/>
<path d="M50 40h44" stroke="#2463ad" stroke-width="5" stroke-linecap="round"/>
<text x="110" y="47" font-size="16" fill="#2463ad" font-weight="700">04 / РАЗВЁРТЫВАНИЕ</text>
<text x="50" y="104" font-size="35" fill="#122844" font-weight="700">Один VPS. Изолированные приложения.</text>
<text x="50" y="143" font-size="20" fill="#536780" font-weight="400">Общий HTTPS-вход и отдельный контур MGIMO-LMS</text>
