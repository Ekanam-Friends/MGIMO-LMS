<rect x="370" y="200" width="460" height="110" rx="17" fill="white" stroke="#d8e3f0" stroke-width="1.5" />
<text x="392" y="237" font-size="23" fill="#122844" font-weight="650">Браузер / интернет</text>
<text x="392" y="266" font-size="18" fill="#536780" font-weight="400">lms-university.ekanamfriends.ru</text>
</g>
