<rect x="80" y="695" width="280" height="100" rx="17" fill="white" stroke="#d8e3f0" stroke-width="1.5" />
<text x="102" y="732" font-size="23" fill="#122844" font-weight="650">FastAPI / web</text>
<text x="102" y="761" font-size="18" fill="#536780" font-weight="400">lms-web:8000</text>
</g>
<g data-card="true">
<rect x="80" y="855" width="280" height="100" rx="17" fill="white" stroke="#d8e3f0" stroke-width="1.5" />
<text x="102" y="892" font-size="23" fill="#122844" font-weight="650">aiogram / bot</text>
<text x="102" y="921" font-size="18" fill="#536780" font-weight="400">Telegram long polling</text>
</g>
<g data-card="true">
<rect x="430" y="790" width="280" height="120" rx="17" fill="#edf8f4" stroke="#d8e3f0" stroke-width="1.5" />
<text x="452" y="827" font-size="23" fill="#176d64" font-weight="650">PostgreSQL</text>
<text x="452" y="856" font-size="18" fill="#536780" font-weight="400">mgimo-lms-db-1</text>
