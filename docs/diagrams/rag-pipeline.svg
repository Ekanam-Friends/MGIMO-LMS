<text x="72" y="881" font-size="18" fill="#536780" font-weight="400">Ссылки и дословные поля</text>
</g>
<g data-card="true">
<rect x="435" y="790" width="330" height="110" rx="17" fill="#edf8f4" stroke="#d8e3f0" stroke-width="1.5" />
<text x="457" y="827" font-size="23" fill="#176d64" font-weight="650">Ответ в кабинете</text>
<text x="457" y="856" font-size="18" fill="#536780" font-weight="400">Выдержки и ограничения</text>
<text x="457" y="881" font-size="18" fill="#536780" font-weight="400">Снимок: ответ частичный</text>
</g>
<g data-card="true">
<rect x="820" y="790" width="330" height="110" rx="17" fill="white" stroke="#d8e3f0" stroke-width="1.5" />
