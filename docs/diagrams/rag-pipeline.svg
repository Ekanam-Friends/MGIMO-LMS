<text x="842" y="306" font-size="18" fill="#536780" font-weight="400">Фрагменты · BM25</text>
<text x="842" y="331" font-size="18" fill="#536780" font-weight="400">Эмбеддинги — опция</text>
</g>
<rect x="30" y="460" width="1140" height="190" rx="22" fill="#f2f6fc" stroke="#d8e3f0" stroke-width="1.5" />
