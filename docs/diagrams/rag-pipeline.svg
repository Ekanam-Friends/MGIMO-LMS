<rect x="694.5" y="391" width="191" height="27" rx="6" fill="#fff" stroke="#fff" stroke-width="1.5" />
<text x="790" y="410" text-anchor="middle" font-size="16" fill="#536780">контекст из корпуса</text>
<path d="M985 625 V685 H405 V780 H215 V790" fill="none" stroke="#7c96b4" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"  />
<rect x="446" y="666" width="308" height="27" rx="6" fill="#fff" stroke="#fff" stroke-width="1.5" />
<text x="600" y="685" text-anchor="middle" font-size="16" fill="#536780">ответ и использованные фрагменты</text>
<text x="50" y="980" font-size="18" fill="#536780" font-weight="400">Недостаточно оснований → уточнение или отказ. Историческая редакция требует подтверждения.</text>
<text x="50" y="1012" font-size="18" fill="#536780" font-weight="400">Точность OCR и действие норм проверяются отдельно; аудит модели не заменяет ручную сверку.</text>
