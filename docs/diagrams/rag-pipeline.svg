<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc">
<title id="title">От документа — к проверяемому ответу</title><desc id="desc">Реализованная цепочка: публичные PDF, извлечение текста и OCR, снимок фрагментов, поиск BM25, выбор выдержек GigaChat и отдельный аудит применимости. Эмбеддинги доступны как опция, по умолчанию выключены. Непроверенный снимок даёт только частичный справочный ответ; OCR и действие редакций требуют отдельной сверки.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c96b4"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif"><rect width="1200" height="1060" rx="24" fill="#fff"/>
<path d="M50 40h44" stroke="#2463ad" stroke-width="5" stroke-linecap="round"/>
<text x="110" y="47" font-size="16" fill="#2463ad" font-weight="700">02 / РЕАЛИЗОВАННАЯ RAG-ЦЕПОЧКА</text>
<text x="50" y="104" font-size="35" fill="#122844" font-weight="700">От документа — к проверяемому ответу</text>
<text x="50" y="143" font-size="20" fill="#536780" font-weight="400">Поиск по снимку корпуса, выбор выдержек и проверка через GigaChat</text>
<rect x="30" y="185" width="1140" height="190" rx="22" fill="#f2f6fc" stroke="#d8e3f0" stroke-width="1.5" />
<text x="55" y="221" font-size="16" fill="#2463ad" font-weight="700">01 / ПОДГОТОВКА КОРПУСА</text>
