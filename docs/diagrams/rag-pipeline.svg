<text x="842" y="581" font-size="18" fill="#536780" font-weight="400">GigaChat API</text>
<text x="842" y="606" font-size="18" fill="#536780" font-weight="400">Вызов только с бэкенда</text>
</g>
<rect x="30" y="735" width="1140" height="190" rx="22" fill="#f2f6fc" stroke="#d8e3f0" stroke-width="1.5" />
