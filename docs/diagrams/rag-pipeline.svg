<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc">
<title id="title">От документа — к проверяемому ответу</title><desc id="desc">Планируемая цепочка RAG: официальные положения, извлечение текста и OCR, фрагменты и эмбеддинги, поиск по вопросу, генерация через API, проверка цитат и ответ со ссылкой. При нехватке оснований — уточнение или отказ.</desc>
