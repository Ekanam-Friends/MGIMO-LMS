<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
<title id="title">Один кабинет. Общая база.</title><desc id="desc">Браузер через Caddy обращается к FastAPI. Telegram обслуживается отдельным aiogram-ботом. Оба работают с PostgreSQL. Импортёр получает расписание РУЗ. Pyrus согласует справки. ИИ-ассистент и API модели показаны как план.</desc>
