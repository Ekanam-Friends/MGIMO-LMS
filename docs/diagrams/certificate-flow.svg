<text x="110" y="47" font-size="16" fill="#2463ad" font-weight="700">03 / СПРАВКИ И СОГЛАСОВАНИЕ</text>
<text x="50" y="104" font-size="35" fill="#122844" font-weight="700">Заявка без очереди в деканат</text>
<text x="50" y="143" font-size="20" fill="#536780" font-weight="400">Кабинет принимает запрос, Pyrus ведёт согласование, результат возвращается студенту</text>
