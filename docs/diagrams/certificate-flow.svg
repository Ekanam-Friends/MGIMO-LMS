<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">Заявка без очереди в деканат</title><desc id="desc">Студент создаёт заявку в FastAPI, которая отправляется в Pyrus. После проверки в деканате и подписи декана подписанный вебхук запускает сверку через API. Статус сохраняется в PostgreSQL; кабинет показывает PDF, бот отправляет уведомление.</desc>
