# Стенд кабинета на общем VPS (решение 0001): своя база, свой web, своя docker-сеть.
# Наружу ничего не публикуется (порт базы — только на 127.0.0.1 сервера). HTTPS делает общий Caddy проекта Ikanam-schedule:
# он подключён к внешней сети `edge` и проксирует lms-university.ekanamfriends.ru на lms-web:8000
# (см. docs/deploy.md).
#
#   docker network create edge   # один раз на сервере
#   docker compose up -d --build
#
# Логи ограничены 3 × 10 МБ на контейнер, как у соседнего проекта.

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Только на loopback сервера: снаружи порт закрыт, участники команды ходят через
    # SSH-туннель (см. docs/deploy.md, «Доступ к базе»). 5432 на хосте занят базой Ikanam.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    <<: *logging
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://lms:${POSTGRES_PASSWORD}@db:5432/lms
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      default:
      edge:
        aliases: [lms-web]

  # Telegram-бот (решение 0005): long polling, наружу не публикуется. Тот же образ, что web;
  # миграции применяет web, поэтому бот стартует после него.
  bot:
    <<: *logging
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://lms:${POSTGRES_PASSWORD}@db:5432/lms
    command: ["python", "-m", "app.bot.main"]
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  pgdata:

networks:
  edge:
    external: true
