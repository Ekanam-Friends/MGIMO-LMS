# Стенд кабинета на общем VPS (решение 0001): своя база, свой web, своя docker-сеть.
# Наружу ничего не публикуется (порт базы — только на 127.0.0.1 сервера). HTTPS делает общий Caddy проекта Ikanam-schedule:
# он подключён к внешней сети `edge` и проксирует lms-university.ekanamfriends.ru на lms-web:8000
# (см. docs/deploy.md).
#
#   docker network create edge   # один раз на сервере
#   docker compose up -d --build
#
# Логи ограничены 3 × 10 МБ на контейнер, как у соседнего проекта.

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Только на loopback сервера: снаружи порт закрыт, участники команды ходят через
    # SSH-туннель (см. docs/deploy.md, «Доступ к базе»). 5432 на хосте занят базой Ikanam.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Общий кэш чтений web и бота (решение 0027): импорт расписания в боте инвалидирует кэш web.
  # Порт не публикуется — Redis виден только в сети проекта. Данные — только кэш: без
  # сохранения на диск, при нехватке памяти вытесняются давно не читанные ключи (allkeys-lru).
  redis:
    <<: *logging
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru",
              "--save", "", "--appendonly", "no"]
    mem_limit: 96m
    # Уникальное имя в сети: бот на сервере подключён ещё и к сети Ikanam, где короткое
    # имя `redis` могло бы указать на чужой сервис (как было с `db`, см. docs/deploy.md).
    networks:
      default:
        aliases: [lms-redis]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    <<: *logging
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://lms:${POSTGRES_PASSWORD}@db:5432/lms
      CACHE_URL: redis://lms-redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      # Не service_healthy: без Redis кабинет работает (fail-open), просто без кэша.
      redis:
        condition: service_started
    expose:
      - "8000"
    networks:
      default:
      edge:
        aliases: [lms-web]

  # Telegram-бот (решение 0005): long polling, наружу не публикуется. Тот же образ, что web;
  # миграции применяет web, поэтому бот стартует после него.
  bot:
    <<: *logging
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://lms:${POSTGRES_PASSWORD}@db:5432/lms
      CACHE_URL: redis://lms-redis:6379/0
    command: ["python", "-m", "app.bot.main"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_started

volumes:
  pgdata:

networks:
  edge:
    external: true
