name: Синхронизация Issues и Project

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Только показать изменения
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: project-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || vars.PROJECT_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
      SYNC_REPOSITORY: Ekanam-Friends/MGIMO-LMS
      SYNC_PROJECT_NUMBER: '4'
      PROJECT_SYNC_ENABLED: ${{ vars.PROJECT_SYNC_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Проверить подключение доступа
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Добавьте секрет PROJECT_SYNC_TOKEN перед включением синхронизации'
            exit 1
          fi
      - name: Синхронизировать
        env:
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
        run: python3 scripts/sync_github_project.py --workflow
