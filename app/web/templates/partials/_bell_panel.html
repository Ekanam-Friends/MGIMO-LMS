<div class="bell__head">
  <strong>{{ _('Уведомления') }}</strong>
  {% if items | selectattr("unread") | list %}
  <button type="button" class="link-btn" hx-post="/notifications/read-all" hx-target="#bell-panel" hx-swap="innerHTML">{{ _('Прочитать всё') }}</button>
  {% endif %}
</div>
<div class="bell__list">
  {% for it in items %}{% include "partials/_notif_item.html" %}
  {% else %}<p class="bell__empty">{{ _('Пока ничего нового.') }}</p>{% endfor %}
</div>
<a class="bell__all" href="/notifications">{{ _('Все уведомления') }}</a>
