{% extends "base.html" %}
{% block title %}{{ _('Вход') }}{% endblock %}
{% block bare %}
<div class="login">
  <form class="login__card" method="post" action="/login" autocomplete="on">
    <a class="wordmark wordmark--big"><span class="wordmark__mark">{{ _('ЛК') }}</span><span class="wordmark__text">{{ _('студента') }}<br><small>{{ _('концепт') }}</small></span></a>
    <h1 class="login__title">{{ _('Вход в личный кабинет') }}</h1>
    {% if error %}<p class="alert alert--error" role="alert">{{ error }}</p>{% endif %}
    <label class="field">
      <span class="field__label">{{ _('Логин') }}</span>
      <input class="field__input" name="login" value="{{ login }}" autocomplete="username" required autofocus>
    </label>
    <label class="field">
      <span class="field__label">{{ _('Пароль') }}</span>
      <input class="field__input" type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="btn btn--primary btn--wide" type="submit">{{ _('Войти') }}</button>
    <p class="login__hint">{{ _('Тестовые учётки для жюри создаёт') }} <code>python -m app.seed</code>.</p>
  </form>
</div>
{% endblock %}
