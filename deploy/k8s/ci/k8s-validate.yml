name: Проверка манифестов Kubernetes

# Статическая проверка deploy/k8s (решение 0028): кластер не нужен.
on:
  pull_request:
    paths:
      - 'deploy/k8s/**'
      - 'scripts/k8s-*'
      - '.env.example'
      - 'app/core/config.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml kubernetes-validate
      - run: python scripts/k8s-validate.py --require-schema
