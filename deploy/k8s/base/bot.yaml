# bot — Telegram-бот (решение 0005), long polling. Тот же образ, что web.
#
# Ровно одна реплика и strategy: Recreate: Telegram отдаёт обновления только одному
# getUpdates на токен; два пода одновременно получали бы 409 Conflict и теряли апдейты.
# Service не нужен: бот сам ходит наружу, входящих соединений нет.
# Если TELEGRAM_BOT_TOKEN в .env пуст, scripts/k8s-up.sh ставит replicas: 0 (бот без токена
# сразу завершается, как и в compose — там deploy.sh его просто не поднимает).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot
  labels:
    app.kubernetes.io/name: bot
    app.kubernetes.io/component: bot
    app.kubernetes.io/part-of: mgimo-lms
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: bot
      app.kubernetes.io/part-of: mgimo-lms
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bot
        app.kubernetes.io/component: bot
        app.kubernetes.io/part-of: mgimo-lms
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Миграции применяет только web. Бот ждёт, пока схема станет актуальной
        # (`alembic current` печатает «<ревизия> (head)»), сам ничего не меняет.
        - name: wait-schema
          image: mgimo-lms
          imagePullPolicy: Never
          command:
            - sh
            - -c
            - |
              until alembic current 2>/dev/null | grep -q '(head)'; do
                echo "жду миграции от web..." >&2
                sleep 5
              done
          envFrom:
            - configMapRef:
                name: lms-config
            - configMapRef:
                name: lms-env
                optional: true
            - secretRef:
                name: lms-secrets
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: bot
          image: mgimo-lms
          imagePullPolicy: Never
          command: ["python", "-m", "app.bot.main"]
          envFrom:
            - configMapRef:
                name: lms-config
            - configMapRef:
                name: lms-env
                optional: true
            - secretRef:
                name: lms-secrets
          env:
            - name: CACHE_URL
              valueFrom:
                configMapKeyRef:
                  name: lms-config
                  key: CACHE_URL
            - name: TMPDIR
              value: /tmp
          # HTTP-эндпоинта у бота нет; при падении процесса под перезапускается сам.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
