# Дополнение к основному compose; запуск — python3 scripts/setup_replica.py на VPS.
services:
  db-replica:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    shm_size: 64m
    environment:
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
      - ./scripts/server/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    secrets:
      - replication_password
    entrypoint: [sh, /usr/local/bin/replica-entrypoint.sh]
    command: [postgres, -c, shared_buffers=64MB, -c, hot_standby=on]
    # Внешнего порта нет; доступ через docker compose exec или внутреннюю сеть.
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U lms -d lms && test -f "$$PGDATA/standby.signal"']
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata-replica:

secrets:
  replication_password:
    file: ./.secrets/replication-password
